name: Keep scheduled builds active

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    name: Record repository activity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Update keepalive marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          path=".github/keepalive"
          sha="$(
            gh api "/repos/$REPOSITORY/contents/$path" --jq .sha
          )"
          content="$(
            printf 'Last automated activity: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" |
              base64 -w0
          )"
          gh api \
            --method PUT \
            "/repos/$REPOSITORY/contents/$path" \
            -f message="chore: keep scheduled nightly builds active" \
            -f content="$content" \
            -f sha="$sha"
