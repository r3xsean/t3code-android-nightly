name: Android nightly companion

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional exact unpublished newer upstream nightly tag"
        required: false
        type: string

concurrency:
  group: android-nightly-companion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect unpublished nightlies
    runs-on: ubuntu-24.04
    outputs:
      has_releases: ${{ steps.detect.outputs.has_releases }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Check out builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Test builder
        run: npm test

      - id: detect
        name: Resolve official upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: node scripts/detect-nightlies.mjs

  build:
    name: Prepare ${{ matrix.release.upstream_tag }}
    needs: detect
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      delivery: ${{ steps.plan.outputs.delivery }}
      native_fingerprint: ${{ steps.plan.outputs.native_fingerprint }}
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect.outputs.matrix).include }}
    steps:
      - name: Check out trusted builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: builder
          persist-credentials: false

      - name: Check out exact upstream commit without credentials
        env:
          EXPECTED_SHA: ${{ matrix.release.upstream_sha }}
        run: |
          mkdir source
          git -C source init
          git -C source remote add origin https://github.com/pingdotgg/t3code.git
          git -C source fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          git -C source remote remove origin

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          working-directory: source
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Apply normalized companion identity
        env:
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_UPDATE_CHANNEL: ${{ vars.EXPO_UPDATE_CHANNEL }}
        run: node builder/scripts/prepare-source.mjs fingerprint source

      - name: Align React with the React Native renderer
        run: |
          node builder/scripts/align-react.mjs source
          cd source
          corepack pnpm@11.10.0 install --no-frozen-lockfile
          node ../builder/scripts/align-react.mjs . --check

      - name: Configure T3 Connect public identifiers
        env:
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: >-
          node builder/scripts/connect-config.mjs
          --emit-github-env
          "$GITHUB_ENV"

      - name: Type-check mobile client
        working-directory: source/apps/mobile
        run: vp run typecheck

      - id: plan
        name: Fingerprint native compatibility and select delivery
        working-directory: source/apps/mobile
        env:
          APP_VARIANT: preview
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_UPDATE_CHANNEL: ${{ vars.EXPO_UPDATE_CHANNEL }}
          NATIVE_BASE_JSON: ${{ toJSON(matrix.release.native_base) }}
        run: |
          vp exec fingerprint fingerprint:generate \
            --platform android > "$RUNNER_TEMP/fingerprint.json"
          node "$GITHUB_WORKSPACE/builder/scripts/hybrid-delivery.mjs" \
            "$RUNNER_TEMP/fingerprint.json" \
            "$NATIVE_BASE_JSON"

      - name: Assign explicit runtime and delivery version
        env:
          NATIVE_FINGERPRINT: ${{ steps.plan.outputs.native_fingerprint }}
          VERSION_CODE: ${{ matrix.release.version_code }}
          VERSION_NAME: ${{ matrix.release.version_name }}
        run: |
          node builder/scripts/prepare-source.mjs \
            finalize \
            source \
            "$VERSION_CODE" \
            "$VERSION_NAME" \
            "$NATIVE_FINGERPRINT"

      - name: Verify resolved public configuration
        working-directory: source/apps/mobile
        env:
          APP_VARIANT: preview
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_UPDATE_CHANNEL: ${{ vars.EXPO_UPDATE_CHANNEL }}
          NATIVE_FINGERPRINT: ${{ steps.plan.outputs.native_fingerprint }}
          VERSION_NAME: ${{ matrix.release.version_name }}
        run: |
          config="$RUNNER_TEMP/t3code-expo-public-config.json"
          vp exec expo config --type public --json > "$config"
          node "$GITHUB_WORKSPACE/builder/scripts/connect-config.mjs" \
            --verify-expo \
            "$config"
          node "$GITHUB_WORKSPACE/builder/scripts/verify-expo-config.mjs" \
            "$config"

      - name: Export static Android update
        if: steps.plan.outputs.delivery == 'ota'
        working-directory: source/apps/mobile
        env:
          APP_VARIANT: preview
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
        run: >-
          vp exec expo export
          --platform android
          --output-dir "$GITHUB_WORKSPACE/ota-dist"
          --dump-assetmap

      - name: Upload static update
        if: steps.plan.outputs.delivery == 'ota'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ota-${{ matrix.release.upstream_tag }}
          path: ota-dist
          if-no-files-found: error
          retention-days: 1

      - name: Generate Android project
        if: steps.plan.outputs.delivery == 'apk'
        working-directory: source/apps/mobile
        env:
          APP_VARIANT: preview
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
        run: vp exec expo prebuild --clean --platform android

      - name: Compile release APK
        if: steps.plan.outputs.delivery == 'apk'
        working-directory: source/apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage unsigned APK
        if: steps.plan.outputs.delivery == 'apk'
        env:
          VERSION_NAME: ${{ matrix.release.version_name }}
        run: >-
          cp
          source/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "unsigned-${VERSION_NAME}.apk"

      - name: Upload unsigned build
        if: steps.plan.outputs.delivery == 'apk'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unsigned-${{ matrix.release.upstream_tag }}
          path: unsigned-${{ matrix.release.version_name }}.apk
          if-no-files-found: error
          retention-days: 1

  publish-ota:
    name: Publish trusted OTA update
    needs:
      - detect
      - build
    if: needs.build.outputs.delivery == 'ota'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted builder only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: builder
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Install locked EAS publisher before exposing credentials
        working-directory: builder
        run: npm ci --ignore-scripts

      - name: Download pre-exported static update
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ota-${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_tag }}
          path: publisher/dist

      - name: Create trusted static publisher configuration
        env:
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_UPDATE_CHANNEL: ${{ vars.EXPO_UPDATE_CHANNEL }}
          NATIVE_FINGERPRINT: ${{ needs.build.outputs.native_fingerprint }}
          VERSION_NAME: ${{ fromJSON(needs.detect.outputs.matrix).include[0].version_name }}
        run: node builder/scripts/eas-publisher.mjs publisher

      - name: Publish static update without executing upstream source
        working-directory: publisher
        env:
          DISABLE_EAS_ANALYTICS: "1"
          EAS_CLI_SENTRY_DSN: ""
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_CHANNEL: ${{ vars.EXPO_UPDATE_CHANNEL }}
          UPSTREAM_TAG: ${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_tag }}
        run: |
          test -n "$EXPO_TOKEN"
          test -f dist/metadata.json
          "$GITHUB_WORKSPACE/builder/node_modules/.bin/eas" update \
            --input-dir dist \
            --skip-bundler \
            --channel "$UPDATE_CHANNEL" \
            --platform android \
            --environment production \
            --message "T3 Code $UPSTREAM_TAG" \
            --json \
            --non-interactive > "$RUNNER_TEMP/eas-update.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$RUNNER_TEMP/eas-update.json"

  record-ota:
    name: Record successful OTA delivery
    needs:
      - detect
      - build
      - publish-ota
    if: needs.build.outputs.delivery == 'ota' && needs.publish-ota.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out a clean trusted builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Record successfully processed nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_tag }}
        run: node scripts/record-processed.mjs

      - name: Delete temporary Actions artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cleanup-run-artifacts.mjs

  sign:
    name: Sign native fallback APK
    needs:
      - detect
      - build
    if: needs.build.outputs.delivery == 'apk'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
    steps:
      - name: Check out trusted builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: builder
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Download unsigned build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: unsigned-${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_tag }}
          path: unsigned

      - name: Install pinned Android build tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Sign and verify APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          UPSTREAM_TAG: ${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_tag }}
          UPSTREAM_RELEASE_ID: ${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_release_id }}
          UPSTREAM_PUBLISHED_AT: ${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_published_at }}
          UPSTREAM_SHA: ${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_sha }}
          VERSION_CODE: ${{ fromJSON(needs.detect.outputs.matrix).include[0].version_code }}
          VERSION_NAME: ${{ fromJSON(needs.detect.outputs.matrix).include[0].version_name }}
          NATIVE_FINGERPRINT: ${{ needs.build.outputs.native_fingerprint }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_UPDATE_CHANNEL: ${{ vars.EXPO_UPDATE_CHANNEL }}
          EXPECTED_PACKAGE: dev.r3xsean.t3code.nightly
          EXPECTED_CERTIFICATE_SHA256: 3EAAE08EE4FA2F8A2D2A85FE359840267F6E022B1963C19A60768D96EE40578B
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/t3code-nightly.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          build_tools_dir="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          test -x "$build_tools_dir/zipalign"
          test -x "$build_tools_dir/apksigner"
          unsigned="unsigned/unsigned-${VERSION_NAME}.apk"
          test -f "$unsigned"
          prefix="t3code-nightly-${UPSTREAM_TAG#v}"
          aligned="$RUNNER_TEMP/$prefix-aligned.apk"
          signed="$GITHUB_WORKSPACE/$prefix.apk"

          "$build_tools_dir/zipalign" -f 4 "$unsigned" "$aligned"
          "$build_tools_dir/apksigner" sign \
            --ks "$keystore" \
            --ks-type PKCS12 \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$signed" \
            "$aligned"

          bash builder/scripts/verify-apk.sh \
            "$signed" \
            "$EXPECTED_PACKAGE" \
            "$VERSION_CODE" \
            "$VERSION_NAME" \
            "$GITHUB_WORKSPACE/$prefix.json" \
            arm64-v8a

      - name: Upload verified build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: companion-${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_tag }}
          path: |
            t3code-nightly-${{ fromJSON(needs.detect.outputs.matrix).include[0].version_name }}.apk
            t3code-nightly-${{ fromJSON(needs.detect.outputs.matrix).include[0].version_name }}.apk.sha256
            t3code-nightly-${{ fromJSON(needs.detect.outputs.matrix).include[0].version_name }}.json
          if-no-files-found: error
          retention-days: 3

  publish-apk:
    name: Publish native fallback APK
    needs:
      - detect
      - build
      - sign
    if: needs.build.outputs.delivery == 'apk'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    env:
      ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
      EXPECTED_CERTIFICATE_SHA256: 3EAAE08EE4FA2F8A2D2A85FE359840267F6E022B1963C19A60768D96EE40578B
    steps:
      - name: Check out trusted builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Android build tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Download exact verified build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: companion-${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_tag }}
          path: artifacts

      - name: Reverify published APK signature
        run: |
          mapfile -t apks < <(find artifacts -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          output="$RUNNER_TEMP/publish-apksigner.txt"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" \
            verify --verbose --print-certs "${apks[0]}" > "$output"
          actual="$(node scripts/apk-certificate.mjs "$output")"
          test "$actual" = "$EXPECTED_CERTIFICATE_SHA256"

      - name: Publish verified APK
        env:
          ARTIFACTS_DIRECTORY: ${{ github.workspace }}/artifacts
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MATRIX: ${{ needs.detect.outputs.matrix }}
          NATIVE_FINGERPRINT: ${{ needs.build.outputs.native_fingerprint }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_UPDATE_CHANNEL: ${{ vars.EXPO_UPDATE_CHANNEL }}
        run: node scripts/publish-releases.mjs

      - name: Record successfully processed nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_tag }}
        run: node scripts/record-processed.mjs

      - name: Delete temporary Actions artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cleanup-run-artifacts.mjs
