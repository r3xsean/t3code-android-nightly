name: Android nightly companion

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional exact unpublished newer upstream nightly tag"
        required: false
        type: string

concurrency:
  group: android-nightly-companion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect unpublished nightlies
    runs-on: ubuntu-24.04
    outputs:
      has_releases: ${{ steps.detect.outputs.has_releases }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Check out builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Test builder
        run: npm test

      - id: detect
        name: Resolve official upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: node scripts/detect-nightlies.mjs

  build:
    name: Build ${{ matrix.release.upstream_tag }}
    needs: detect
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect.outputs.matrix).include }}
    steps:
      - name: Check out builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: builder
          persist-credentials: false

      - name: Check out exact upstream commit without credentials
        env:
          EXPECTED_SHA: ${{ matrix.release.upstream_sha }}
        run: |
          mkdir source
          git -C source init
          git -C source remote add origin https://github.com/pingdotgg/t3code.git
          git -C source fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          git -C source remote remove origin

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          working-directory: source
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Apply companion identity
        run: >-
          node builder/scripts/prepare-source.mjs
          source
          '${{ matrix.release.version_code }}'
          '${{ matrix.release.version_name }}'

      - name: Align React with the React Native renderer
        run: |
          node builder/scripts/align-react.mjs source
          cd source
          corepack pnpm@11.10.0 install --no-frozen-lockfile
          node ../builder/scripts/align-react.mjs . --check

      - name: Configure T3 Connect public identifiers
        env:
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: >-
          node builder/scripts/connect-config.mjs
          --emit-github-env
          "$GITHUB_ENV"

      - name: Type-check mobile client
        working-directory: source/apps/mobile
        run: vp run typecheck

      - name: Verify resolved T3 Connect configuration
        working-directory: source/apps/mobile
        run: |
          config="$RUNNER_TEMP/t3code-expo-public-config.json"
          vp exec expo config --type public --json > "$config"
          node "$GITHUB_WORKSPACE/builder/scripts/connect-config.mjs" \
            --verify-expo \
            "$config"

      - name: Generate Android project
        working-directory: source/apps/mobile
        env:
          APP_VARIANT: preview
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
        run: vp exec expo prebuild --clean --platform android

      - name: Compile release APK
        working-directory: source/apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify compiled T3 Connect configuration
        run: |
          apk="source/apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          bundle="$RUNNER_TEMP/index.android.bundle"
          dump="$RUNNER_TEMP/index.android.bundle.dump"
          hermesc="source/apps/mobile/node_modules/react-native/sdks/hermesc/linux64-bin/hermesc"
          unzip -p "$apk" assets/index.android.bundle > "$bundle"
          test -s "$bundle"
          test -x "$hermesc"
          "$hermesc" -dump-bytecode "$bundle" > "$dump"
          test -s "$dump"
          node builder/scripts/connect-config.mjs --verify-bundle "$dump"

      - name: Stage unsigned APK
        env:
          VERSION_NAME: ${{ matrix.release.version_name }}
        run: >-
          cp
          source/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "unsigned-${VERSION_NAME}.apk"

      - name: Upload unsigned build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unsigned-${{ matrix.release.upstream_tag }}
          path: unsigned-${{ matrix.release.version_name }}.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign ${{ matrix.release.upstream_tag }}
    needs:
      - detect
      - build
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect.outputs.matrix).include }}
    steps:
      - name: Check out trusted builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: builder
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Download unsigned build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: unsigned-${{ matrix.release.upstream_tag }}
          path: unsigned

      - name: Install pinned Android build tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Sign and verify APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          UPSTREAM_TAG: ${{ matrix.release.upstream_tag }}
          UPSTREAM_RELEASE_ID: ${{ matrix.release.upstream_release_id }}
          UPSTREAM_PUBLISHED_AT: ${{ matrix.release.upstream_published_at }}
          UPSTREAM_SHA: ${{ matrix.release.upstream_sha }}
          VERSION_CODE: ${{ matrix.release.version_code }}
          VERSION_NAME: ${{ matrix.release.version_name }}
          EXPECTED_PACKAGE: dev.r3xsean.t3code.nightly
          EXPECTED_CERTIFICATE_SHA256: 3EAAE08EE4FA2F8A2D2A85FE359840267F6E022B1963C19A60768D96EE40578B
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/t3code-nightly.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          build_tools_dir="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          test -x "$build_tools_dir/zipalign"
          test -x "$build_tools_dir/apksigner"
          unsigned="unsigned/unsigned-${VERSION_NAME}.apk"
          test -f "$unsigned"
          prefix="t3code-nightly-${UPSTREAM_TAG#v}"
          aligned="$RUNNER_TEMP/$prefix-aligned.apk"
          signed="$GITHUB_WORKSPACE/$prefix.apk"

          "$build_tools_dir/zipalign" -f 4 "$unsigned" "$aligned"
          "$build_tools_dir/apksigner" sign \
            --ks "$keystore" \
            --ks-type PKCS12 \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$signed" \
            "$aligned"

          bash builder/scripts/verify-apk.sh \
            "$signed" \
            "$EXPECTED_PACKAGE" \
            "$VERSION_CODE" \
            "$VERSION_NAME" \
            "$GITHUB_WORKSPACE/$prefix.json" \
            arm64-v8a

      - name: Upload verified build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: companion-${{ matrix.release.upstream_tag }}
          path: |
            t3code-nightly-${{ matrix.release.version_name }}.apk
            t3code-nightly-${{ matrix.release.version_name }}.apk.sha256
            t3code-nightly-${{ matrix.release.version_name }}.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish verified companions
    needs:
      - detect
      - sign
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
      EXPECTED_CERTIFICATE_SHA256: 3EAAE08EE4FA2F8A2D2A85FE359840267F6E022B1963C19A60768D96EE40578B
    steps:
      - name: Check out builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Android build tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Download exact verified build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: companion-${{ fromJSON(needs.detect.outputs.matrix).include[0].upstream_tag }}
          path: artifacts

      - name: Reverify published APK signature
        run: |
          mapfile -t apks < <(find artifacts -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          output="$RUNNER_TEMP/publish-apksigner.txt"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" \
            verify --verbose --print-certs "${apks[0]}" > "$output"
          actual="$(
            node scripts/apk-certificate.mjs "$output"
          )"
          test "$actual" = "$EXPECTED_CERTIFICATE_SHA256"

      - name: Publish in upstream order
        env:
          ARTIFACTS_DIRECTORY: ${{ github.workspace }}/artifacts
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MATRIX: ${{ needs.detect.outputs.matrix }}
        run: node scripts/publish-releases.mjs

      - name: Delete temporary Actions artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cleanup-run-artifacts.mjs
